# Codex 专有的 skill 元数据（Claude Code 会忽略这个文件）。
# 官方文档：https://developers.openai.com/codex/skills →「Optional metadata」
interface:
  display_name: "search4all 知识库"
  short_description: "检索实验室内部生信知识库，带来源返回"

policy:
